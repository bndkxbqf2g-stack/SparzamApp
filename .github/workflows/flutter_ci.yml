name: Flutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        # Keep a broken widget test from holding the entire CI job open while
        # still running the complete suite and reporting the test name.
        run: timeout --signal=TERM 5m flutter test --timeout 30s --reporter expanded
      - name: Build web
        run: flutter build web --release

